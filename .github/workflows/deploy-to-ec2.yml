name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create archive
        run: tar --warning=no-file-changed -czf roboapp.tar.gz --exclude='.git' --exclude='.venv' . || true

      - name: Copy archive to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "roboapp.tar.gz"
          target: "${{ secrets.EC2_APP_DIR }}/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            tar -xzf roboapp.tar.gz
            rm roboapp.tar.gz
            # Optional: install dependencies
            if [ -f requirements.txt ]; then
              python3 -m venv venv
              source venv/bin/activate
              pip install -r requirements.txt
            fi
            # Restart your app (adjust command as needed)
            sudo systemctl restart roboapp || true
