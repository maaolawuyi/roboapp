name: CI/CD → EC2 (SSH)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          tar --ignore-failed-read -czf roboapp.tar.gz --exclude='.git' --exclude='.venv' .

      - name: Copy archive to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "roboapp.tar.gz"
          target: "/tmp"

      - name: Deploy on EC2 and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            VENV="/opt/roboapp-venv"
            REMOTE_USER="${{ secrets.EC2_USER }}"

            sudo mkdir -p "$APP_DIR"
            sudo tar -xzf /tmp/roboapp.tar.gz -C "$APP_DIR" --strip-components=1
            sudo chown -R $REMOTE_USER:$REMOTE_USER "$APP_DIR"

            if [ -f "$APP_DIR/requirements.txt" ]; then
              sudo $VENV/bin/python -m pip install --upgrade pip
              sudo $VENV/bin/python -m pip install -r "$APP_DIR/requirements.txt"
            fi

            sudo systemctl daemon-reload
            sudo systemctl enable roboapp.service || true
            sudo systemctl restart roboapp.service || sudo journalctl -u roboapp.service --no-pager -n 200
