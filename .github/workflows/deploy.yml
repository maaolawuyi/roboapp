name: CI-CD to EC2 (rsync)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ensure rsync installed
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Sync repo to EC2 (excludes .git)
        run: |
          rsync -avz --delete --exclude='.git' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}

      - name: Install dependencies & restart service on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'SSH'
          set -e
          APP_DIR=${{ secrets.EC2_APP_DIR }}
          cd "$APP_DIR"
          if [ -f requirements.txt ]; then
            /opt/roboapp-venv/bin/pip install -r requirements.txt || true
          fi
          # restart app + nginx (sudo available for ec2-user)
          sudo systemctl restart roboapp.service || true
          sudo systemctl restart nginx || true
          echo "Deploy finished on $(hostname)"
          SSH
