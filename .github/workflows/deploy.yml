name: CI-CD to EC2 (SSH)
on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quick import check
        run: python -c "import flask; print('Flask OK')"

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "${{ secrets.EC2_APP_DIR }}"

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo ln -sf ${{ secrets.EC2_APP_DIR }}/systemd/roboapp.service /etc/systemd/system/roboapp.service
            sudo systemctl daemon-reload
            sudo systemctl enable roboapp
            sudo systemctl restart roboapp
            sudo systemctl status roboapp --no-pager -l || true
            sudo systemctl restart nginx
